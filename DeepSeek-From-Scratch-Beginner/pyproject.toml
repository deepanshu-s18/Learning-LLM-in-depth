[project]
name = "DeepSeek-From-Scratch-Beginner"
version = "0.1.0"
description = "From-scratch AI/ML implementation"
requires-python = ">=3.9"
license = {text = "MIT"}

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
