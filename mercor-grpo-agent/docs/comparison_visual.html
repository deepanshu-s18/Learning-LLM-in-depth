<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GRPO vs Mercor GRPO — Visual Comparison</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d0d0d;
      color: #fff;
      font-family: 'Inter', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 48px 24px;
    }

    h1 {
      font-size: 1.1rem;
      font-weight: 400;
      color: #888;
      margin-bottom: 56px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    /* Main grid */
    .diagram {
      display: grid;
      grid-template-columns: 120px 1fr 1fr 1fr;
      gap: 0;
      max-width: 860px;
      width: 100%;
    }

    /* Column headers */
    .col-header {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      font-weight: 700;
      padding-bottom: 28px;
      color: #fff;
    }

    /* Row labels */
    .row-label {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 18px;
      font-size: 0.78rem;
      color: #888;
      font-weight: 400;
    }

    /* Cells */
    .cell {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px 12px;
    }

    /* Arrow rows */
    .arrow-row { display: flex; align-items: center; justify-content: center; padding: 4px 0; }
    .arrow { color: #555; font-size: 1.1rem; line-height: 1; }

    /* Box base */
    .box {
      width: 100%;
      max-width: 200px;
      border-radius: 10px;
      padding: 14px 16px;
      text-align: center;
      line-height: 1.4;
    }
    .box-title { font-size: 0.95rem; font-weight: 600; }
    .box-sub   { font-size: 0.72rem; font-weight: 400; color: #aaa; margin-top: 4px; }

    .box-neutral { border: 1.5px solid #444; background: transparent; color: #fff; }
    .box-green   { border: 1.5px solid #3ecf6e; background: transparent; color: #3ecf6e; }
    .box-cyan    { border: 1.5px solid #38bdf8; background: transparent; color: #38bdf8; }
    .box-red     { border: 1.5px solid #f87171; background: transparent; color: #f87171; }
    .box-purple  { border: 1.5px solid #a78bfa; background: transparent; color: #a78bfa; }

    /* Legend */
    .legend {
      margin-top: 56px;
      display: flex;
      gap: 32px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .legend-item { display: flex; align-items: center; gap: 8px; font-size: 0.78rem; color: #888; }
    .legend-dot  { width: 10px; height: 10px; border-radius: 50%; }
  </style>
</head>
<body>

  <h1>Training Paradigm Comparison</h1>

  <div class="diagram">

    <!-- Row 1: Column headers -->
    <div class="col-header"></div>
    <div class="col-header">Standard GRPO</div>
    <div class="col-header">Mercor GRPO</div>
    <div class="col-header">SFT Baseline</div>

    <!-- Row 2: Prompt boxes -->
    <div class="row-label"></div>
    <div class="cell">
      <div class="box box-neutral">
        <div class="box-title">prompt</div>
